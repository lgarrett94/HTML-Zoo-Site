<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fullstack Zoo</title>
  </head>

  <body>
    <main>
      <h1>Welcome to Fullstack Zoo!</h1>
      <section>
        <h2>Bears</h2>
        <img src="bear.jpeg" alt="Brown Bear" />
        <ul>
          <li>Ollie</li>
          <li>Mona</li>
        </ul>
        <a
          href="https://www.nationalgeographic.com/animals/mammals/facts/bears-grizzly-polar-panda"
          >Bear Facts</a
        >
      </section>

      <section>
        <h2>Giraffes</h2>
        <img src="giraffe.jpeg" alt="Giraffe" />
        <ul>
          <li>Frankie</li>
          <li>Coconut</li>
        </ul>
        <a
          href="https://kids.nationalgeographic.com/animals/mammals/facts/giraffe"
          >Giraffe Facts</a
        >
      </section>

      <section>
        <h2>Lion</h2>
        <img src="lion.webp" alt="Lion" />
        <ul>
          <li>Mella</li>
          <li>Karl</li>
        </ul>
        <a href="https://www.wwf.org.uk/learn/fascinating-facts/lions"
          >Lion Facts
        </a>
      </section>
      <section>
        <h2>Monkeys</h2>
        <img src="monkey.webp" alt="Monkey" />
        <ul>
          <li>Cookie</li>
          <li>Earl</li>
          <li>Banana Pudding</li>
        </ul>
        <a href="https://www.factretriever.com/monkey-facts">Monkey Facts </a>
      </section>
      <section>
        <h2>Alligators</h2>
        <img src="gators.webp" alt="Alligator" />
        <ul>
          <li>Wren</li>
          <li>Aspen</li>
          <li>Mika</li>
        </ul>
        <a href="https://factanimal.com/alligator/">Alligator Facts</a>
      </section>
    </main>
  </body>
</html>
